name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
    

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install
          
    - name: Run Lint
      run: npm run lint

    - name: Run Tests
      run: npm test

    - name: Run Build
      run: npm run build --if-present
